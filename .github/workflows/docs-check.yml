name: 文档检查
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - name: 原包、摘录、参数、白名单和Markdown核查
        run: python tools/verify_docs.py
      - name: 严格构建
        run: python -m mkdocs build --strict
      - name: 构建产物链接、锚点和项目子路径检查
        run: python tools/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: site
          retention-days: 7
