site_name: Unity 罪恶装备风格角色渲染复刻
site_description: 按步骤连接输入、调整明暗与材质，并排查角色渲染问题
site_url: https://xuu-xuu-xuu.github.io/Guilty-Gear_Rendering_imitate/
repo_url: https://github.com/xuu-xuu-xuu/Guilty-Gear_Rendering_imitate
repo_name: xuu-xuu-xuu/Guilty-Gear_Rendering_imitate
edit_uri: ''
strict: true
theme:
  name: material
  language: zh
  font: false
  palette:
    scheme: default
    primary: blue grey
    accent: deep orange
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
plugins:
  - search:
      lang: [zh, en]
markdown_extensions:
  - tables
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
extra_css:
  - assets/stylesheets/extra.css
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - 首页: index.md
  - 准备工程:
      - 开始调参与Debug操作: reference/practice.md
      - 最终效果与准备: chapters/00.md
      - 固定环境、相机和主光: chapters/01.md
      - 连接贴图、UV与顶点数据: chapters/02.md
      - 划分材质并连接Renderer参数: chapters/03.md
  - 实现渲染:
      - 理解Pass与着色执行顺序: chapters/04.md
      - 接入投脸与墙地投影: chapters/08.md
      - 建立两段式明暗: chapters/05.md
      - 整理分区明暗: chapters/06.md
      - 调整亮面与阴面配色: chapters/07.md
      - 细化眼睛与原有白点: chapters/12.md
      - 区分四类材质高光: chapters/09.md
      - 塑造大腿局部亮块: chapters/10.md
      - 添加受控边缘光: chapters/13.md
      - 整理内部线与外轮廓: chapters/11.md
  - 对照与排错:
      - 排查站立循环画面: chapters/14.md
      - 从问题找控制项: reference/evidence-map.md
      - 投影与眼睛开关对照: reference/experiments-20261021.md
      - 站立姿态图集与定位: reference/standing-stability-20261021.md
      - 如何阅读对照图: reference/images.md
  - 参数与输入参考:
      - 材质参数: reference/parameters.md
      - 属性名称与类型: reference/property-declarations.md
      - MPB与最终覆盖: reference/overrides.md
      - 纹理、UV与顶点: reference/channels.md
      - 连接与导入设置: reference/texture-imports.md
      - Debug分量: reference/debug.md
      - 连接现有渲染输入: reference/dependencies.md
      - 素材使用与来源: reference/credits.md
  - 查阅源码:
      - BridgetToon.shader: reference/code/BridgetToon.shader.md
      - GGSTRegionalShading.cs: reference/code/GGSTRegionalShading.cs.md
      - GGSTGeometryShadowMaps.cs: reference/code/GGSTGeometryShadowMaps.cs.md
      - BridgetImitateProfile.cs: reference/code/BridgetImitateProfile.cs.md
      - GGSTGeometryDepth.shader: reference/code/GGSTGeometryDepth.shader.md
      - StageShadowReceiver.shader: reference/code/StageShadowReceiver.shader.md
      - GgstDecal.shader: reference/code/GgstDecal.shader.md
      - GgstGlow.shader: reference/code/GgstGlow.shader.md
      - GgstShadowParked.shader: reference/code/GgstShadowParked.shader.md
